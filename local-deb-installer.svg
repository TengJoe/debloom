<svg width="256" height="256" viewBox="0 0 256 256" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Royal Blue Gradient Plate (Debloom blue palette) -->
    <linearGradient id="bPlate" x1="32" y1="16" x2="224" y2="240" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="50%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>
    <linearGradient id="bBorder" x1="32" y1="16" x2="224" y2="240" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.42"/>
      <stop offset="100%" stop-color="#93c5fd" stop-opacity="0.15"/>
    </linearGradient>
    <!-- Crystal Debian Vault Facets -->
    <linearGradient id="cTop" x1="64" y1="40" x2="192" y2="112" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#e0f2fe"/>
    </linearGradient>
    <linearGradient id="cLeft" x1="48" y1="80" x2="128" y2="208" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#60a5fa"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
    <linearGradient id="cRight" x1="128" y1="80" x2="208" y2="208" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#2563eb"/>
    </linearGradient>
    <linearGradient id="cSwirl" x1="72" y1="48" x2="184" y2="128" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>
    <filter id="cShadow" x="0" y="0" width="256" height="256" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#0f172a" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Continuous-curvature cubic corners: collinear endpoint control vectors give zero curvature at each straight-edge join. -->
  <path d="M80 16H176C240 16 240 16 240 80V176C240 240 240 240 176 240H80C16 240 16 240 16 176V80C16 16 16 16 80 16Z" fill="url(#bPlate)"/>
  <path d="M80 16H176C240 16 240 16 240 80V176C240 240 240 240 176 240H80C16 240 16 240 16 176V80C16 16 16 16 80 16Z" stroke="url(#bBorder)" stroke-width="2"/>

  <!-- Top Glass Sheen -->


  <!-- Floating Crystal Debian Vault -->
  <g filter="url(#cShadow)">
    <!-- Left Facet -->
    <path d="M50 83.2L124 126V204.8C124 209.2 119.2 212 115.2 209.6L52.8 173.6C50 172 48 168.8 48 165.6V88.8C48 84.4 46 80.8 50 83.2Z" fill="url(#cLeft)"/>

    <!-- Right Facet -->
    <path d="M206 83.2L132 126V204.8C132 209.2 136.8 212 140.8 209.6L203.2 173.6C206 172 208 168.8 208 165.6V88.8C208 84.4 210 80.8 206 83.2Z" fill="url(#cRight)"/>

    <!-- Top Lid Facet -->
    <path d="M122.4 34C126 32 130 32 133.6 34L199.2 72C203.2 74.4 203.2 80 199.2 82.4L133.6 120.4C130 122.4 126 122.4 122.4 120.4L56.8 82.4C52.8 80 52.8 74.4 56.8 72L122.4 34Z" fill="url(#cTop)"/>

    <!-- Inner Highlights -->
    <path d="M128 36L196 76L128 116L60 76L128 36Z" stroke="#ffffff" stroke-opacity="0.6" stroke-width="1.8" fill="none"/>
    <line x1="128" y1="120" x2="128" y2="204" stroke="#ffffff" stroke-opacity="0.4" stroke-width="1.8"/>

    <!-- Debian Swirl Arc -->
    <path d="M92 60C108 44 146 44 166 64C180 78 174 98 154 102C138 104.8 126 94 130 82C132.8 74 142 72 148 76.8"
          stroke="url(#cSwirl)" stroke-width="9.6" stroke-linecap="round" fill="none"/>

    <!-- Central Precision Downward Arrow -->
    <path d="M128 88V160M128 160L102 134M128 160L154 134" stroke="#ffffff" stroke-width="12.8" stroke-linecap="round" stroke-linejoin="round"/>


    <!-- Mounting Baseline Notch -->
    <path d="M96 190L128 208L160 190" stroke="#ffffff" stroke-width="7.2" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="4 8"/>
  </g>
</svg>
